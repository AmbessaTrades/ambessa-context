<!doctype html><meta charset="utf-8"><title>Ambessa — visual library</title>
<style>
 :root{--ink:#0b0b0c;--panel:#141416;--line:#232326;--text:#ece9e4;--dim:#8d8a85;--accent:#c98a4b}
 body{background:var(--ink);color:var(--text);font:16px/1.55 -apple-system,Inter,system-ui,sans-serif;margin:0;padding:56px 40px 96px;max-width:1500px;margin-inline:auto}
 h1{font:600 38px/1.1 Georgia,serif;margin:0 0 8px} p.sub{color:var(--dim);max-width:80ch;margin:0 0 8px}
 .src a{color:var(--accent);text-decoration:none} .src{color:var(--dim);margin:0 0 34px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:30px}
 figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
 img{width:100%;display:block;background:#000}
 figcaption{padding:16px 18px 20px;display:flex;flex-direction:column;gap:7px}
 figcaption b{font:600 11px/1 ui-monospace,monospace;color:#6f6c67;letter-spacing:.05em}
 .use{color:var(--text)}
 .steal{color:var(--accent);border-left:2px solid var(--accent);padding-left:12px;font-size:15px}
 .vid{color:#8d8a85;font:12px/1.4 ui-monospace,monospace;text-decoration:none} .vid:hover{color:var(--accent)}
</style>
<h1>Visual library</h1>
<p class="sub">27 references. Each carries what it is and the rule worth taking. Stills only show layout — the motion lives in the two videos below, and these frames are taken from them.</p>
<p class="src">Sources: <a href="https://youtu.be/yMnFHFf43Qg" target="_blank">Claude 2.0 — Jay E / RoboNuggets</a> · <a href="https://youtu.be/P_hvEpI0twQ" target="_blank">Grok Bot — Jay E / RoboNuggets</a></p>

<figure><img src="15-nord-dedicated-ip-plans.png" alt=""><figcaption><b>15-nord-dedicated-ip-plans.png</b><span class="use">dedicated IP pricing: $4.19/mo on 2 years, $5.89 on 1 year, $8.99 monthly</span></figcaption></figure>
<figure><img src="16-split-panel-talking-head-1.png" alt=""><figcaption><b>16-split-panel-talking-head-1.png</b><span class="use">Two devices from one talk: a two-tone comparison panel (sage green vs coral red) with hand-drawn geometry, and the same speaker keyed over a deep blue gradient with a translucent mark behind him</span><span class="steal">The split panel does the argument with no words; the keying lets a mark sit BEHIND the subject; black hoodie on saturated ground separates with zero effort</span></figcaption></figure>
<figure><img src="17-split-panel-talking-head-2.png" alt=""><figcaption><b>17-split-panel-talking-head-2.png</b><span class="use">Two devices from one talk: a two-tone comparison panel (sage green vs coral red) with hand-drawn geometry, and the same speaker keyed over a deep blue gradient with a translucent mark behind him</span><span class="steal">The split panel does the argument with no words; the keying lets a mark sit BEHIND the subject; black hoodie on saturated ground separates with zero effort</span></figcaption></figure>
<figure><img src="18-dark-thread-canvas.png" alt=""><figcaption><b>18-dark-thread-canvas.png</b><span class="use">Three task columns floating on near-black, the subject inset bottom-left in a rounded window, three pill bars turning green as work completes.</span><span class="steal">The ground is a product UI, not a backdrop: the interface IS the set. Subject never larger than a fifth of the frame. Green carries progress, never decoration.</span><a class="vid" href="https://youtu.be/yMnFHFf43Qg" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="19-serif-claim-pill-scale.png" alt=""><figcaption><b>19-serif-claim-pill-scale.png</b><span class="use">A serif headline ('Your brain's context window') over a row of ten rounded bars grading green to red.</span><span class="steal">One serif sentence carries the whole idea; a single row of shapes proves it. This is the house move: claim in serif, evidence as geometry.</span><a class="vid" href="https://youtu.be/yMnFHFf43Qg" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="20-annotation-arrows.png" alt=""><figcaption><b>20-annotation-arrows.png</b><span class="use">A screenshot of a real post, with orange marker highlights and hand-drawn white arrows labelled 'Works' and 'Looks'.</span><span class="steal">Annotation as argument: two arrows and two words explain a product decision. Orange only on the two phrases that matter.</span><a class="vid" href="https://youtu.be/yMnFHFf43Qg" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="21-dashboard-half.png" alt=""><figcaption><b>21-dashboard-half.png</b><span class="use">Subject in a rounded window on the left third; a full dark dashboard mock on the right with an orange sun mark above it.</span><span class="steal">The most reusable layout in the set: person left, live-looking artefact right, dotted texture in the lower third to stop the black going flat.</span><a class="vid" href="https://youtu.be/yMnFHFf43Qg" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="22-icon-diagram.png" alt=""><figcaption><b>22-icon-diagram.png</b><span class="use">'Personal intelligence agents' in serif, subtitle in sans, a monitor outline with three check-marked rows and a white circle with a pause glyph.</span><span class="steal">Thin white line icons at one weight, one green tick repeated three times. The pause circle is a character, not an icon — a small mascot earns warmth.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="23-orange-badge.png" alt=""><figcaption><b>23-orange-badge.png</b><span class="use">The same dashboard again, now carrying an orange 'AI-powered' badge, an ask bar and the words 'LLM-powered' set huge under it.</span><span class="steal">Repeat the artefact and add one element: the difference between the two frames IS the explanation. Accent used once per frame.</span><a class="vid" href="https://youtu.be/yMnFHFf43Qg" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="24-cloud-diagram.png" alt=""><figcaption><b>24-cloud-diagram.png</b><span class="use">'Projects' in serif over a cloud outline containing an orange sun mark, three crab-glyph nodes and a laptop outline below.</span><span class="steal">A diagram is allowed to be friendly. Two stroke weights (blue cloud, white laptop), orange kept for the brand mark only.</span><a class="vid" href="https://youtu.be/yMnFHFf43Qg" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="25-paper-collage.png" alt=""><figcaption><b>25-paper-collage.png</b><span class="use">A mock handwritten note showing HTML/CSS next to a torn-paper 'Video model' card with a red X, plus a green check on 'Much cheaper'.</span><span class="steal">When the argument is a comparison, leave the interface entirely: paper, marker, torn edge. Tactile beats polished for one beat, then back.</span><a class="vid" href="https://youtu.be/yMnFHFf43Qg" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="26-app-icon-grid.png" alt=""><figcaption><b>26-app-icon-grid.png</b><span class="use">Six app icons in a 3×2 grid with names under them, on black, subject still at left.</span><span class="steal">Icons as evidence in a taxonomy frame. Nothing else on screen: no paragraph, no bullet, no arrow. The grid is the sentence.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="27-full-room-honest.png" alt=""><figcaption><b>27-full-room-honest.png</b><span class="use">The subject alone, full frame, real room, real window, hands moving, no graphics at all.</span><span class="steal">The reset shot. After five designed frames, one honest one buys back trust — and it is free to produce.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="28-simulated-product-phone.png" alt=""><figcaption><b>28-simulated-product-phone.png</b><span class="use">Subject fills the left half in a rounded window; an iPhone mock sits right with a green call button and three pill buttons — Delivery, Supplier, Booking.</span><span class="steal">Simulate the product and footnote it (*live demo simulation). Green means 'capability', orange means 'attention' — never the same colour twice.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="29-paper-diorama-offline-vs-web.png" alt=""><figcaption><b>29-paper-diorama-offline-vs-web.png</b><span class="use">Two cut-paper buildings: a cream shopfront with an 'Offline' sign and one clerk, facing a blue-awning storefront with a browser window and four customers.</span><span class="steal">The comparison IS the picture: two buildings, two eras, two palettes. Faceless paper figures sidestep casting entirely — the model village argues better than a chart.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="30-route-on-3d-map.png" alt=""><figcaption><b>30-route-on-3d-map.png</b><span class="use">Dark isometric city block with an orange glowing route from a blue RoboLabs pin to a yellow building; a floating card reads 'Stripe Pay — SENT $500, Transfer fee $0, Just announced 27 Oct'.</span><span class="steal">An invisible transaction becomes physical as a line on a map. The numbers live in a floating card; the motion is the line drawing itself.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="31-real-shop-mock.png" alt=""><figcaption><b>31-real-shop-mock.png</b><span class="use">Subject large left; right, a browser mock of a real-looking Shopify store with product photo, price and a 'Buy with Shop Pay' button.</span><span class="steal">Evidence is allowed brand colour: the real logo earns trust a drawn one cannot. Crop the mock like a screenshot, keep one button hot.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="32-ui-as-the-diagram.png" alt=""><figcaption><b>32-ui-as-the-diagram.png</b><span class="use">Full desktop app on screen — mascot avatars in the sidebar, a pink chat bubble asking for a gift under $50, three product cards as the answer, settings toggles right; subject inset bottom-left.</span><span class="steal">The interface carries the story: bubbles for conversation, cards for the answer, chips for labels. The person shrinks to an inset so the product can be the star.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="33-two-plinths.png" alt=""><figcaption><b>33-two-plinths.png</b><span class="use">Isometric: a phone stand carrying a card labelled 'you', a blue shop building labelled 'the shop', Apple Pay and G Pay marks, and a stand-in card number.</span><span class="steal">Two plinths, two parties, one abstract idea made concrete. Lowercase labels under objects — no arrows needed.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="34-vault-and-secrets.png" alt=""><figcaption><b>34-vault-and-secrets.png</b><span class="use">Orange vault icon, a white bot face, dotted connector lines running to 'Sign in' and 'Checkout' cards filled with orange dots standing in for passwords.</span><span class="steal">Security explained as objects joined by dotted lines. Orange only on the vault and the secrets, so the eye learns what matters in one frame.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="35-paper-title-card.png" alt=""><figcaption><b>35-paper-title-card.png</b><span class="use">Serif 'Agentic payments' on a black plate taped to the wall, an orange cut-paper credit card, a blue paper bag and a white bot face; torn newspaper scraps in the corners.</span><span class="steal">Paper collage says 'concept, not screenshot'. A taped serif plate is the cheapest chapter title there is.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="36-token-board-lit.png" alt=""><figcaption><b>36-token-board-lit.png</b><span class="use">'10 Updates' in white bold; three cards lit with an orange outline under a 'Business' label in serif, then six unlit cards, then the tenth below. Each card carries a mascot glyph and a number.</span><span class="steal">A chapter menu as a board of tokens: shape instead of icon, number instead of word. The first three glow because they are the ones that matter to a business owner.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="37-token-board-unlit.png" alt=""><figcaption><b>37-token-board-unlit.png</b><span class="use">The same board without the glow, the Business label or the emphasis — every card equal.</span><span class="steal">The lit/unlit pair is the motion. One frame gains emphasis and the eye follows without a single arrow; build the pair, not the animation.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="38-three-plinth-circuit.png" alt=""><figcaption><b>38-three-plinth-circuit.png</b><span class="use">'One memory, one context' in serif; three isometric plinths — Claude on yellow, ChatGPT on green, Grok Bot on blue — wired by dotted orange lines to a central stack of orange plates.</span><span class="steal">The circuit board: outer nodes wear the other people's brand colours, the accent is spent only on the thing being added. Dotted wires, no arrows.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="39-blur-in-title.png" alt=""><figcaption><b>39-blur-in-title.png</b><span class="use">A title caught mid-arrival, soft and out of focus behind the bot face; subject large in a rounded window.</span><span class="steal">Titles move. A still from a transition shows text arriving blurred and resolving — stop designing static title cards and design the 400ms that lands them.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="40-highlight-travels.png" alt=""><figcaption><b>40-highlight-travels.png</b><span class="use">The 10 Updates board with 07 lifted, tilted in 3D and ringed in orange while the rest sit flat.</span><span class="steal">Position without a cursor: one card rotates and gains a ring, and the eye knows exactly where we are. No arrow, no highlight bar.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="41-lit-trio.png" alt=""><figcaption><b>41-lit-trio.png</b><span class="use">Same 10 Updates board, first three cards glowing amber under a Business label; the rest sit equal and flat.</span><span class="steal">Emphasis is a property of the frame, not an effect added on top — the lit trio and the flat six are the same component with one flag.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="42-prompt-as-artefact.png" alt=""><figcaption><b>42-prompt-as-artefact.png</b><span class="use">A dark card headed PROMPT holding a monospace prompt, orange COPY and outlined FULLSCREEN; beside it an iPhone showing the same words as a bubble; Calendar and Reminders icons wearing green ticks; an orange 'Take a screenshot!' pill.</span><span class="steal">Show the actual prompt as a copyable artefact — proof instead of paraphrase. Green ticks on the app icons do the 'it worked' job.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="43-icons-as-props.png" alt=""><figcaption><b>43-icons-as-props.png</b><span class="use">Subject large left; a Home icon and a Location icon floating at label size; the phone mock empty beside them.</span><span class="steal">App icons are allowed to be props: unboxed, large, label underneath. The phone stays the hero.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="44-squiggle-wireframe.png" alt=""><figcaption><b>44-squiggle-wireframe.png</b><span class="use">'Chat' in serif, a wireframe chat window drawn in squiggle lines with an orange border and an orange circular X badge; subject on the right.</span><span class="steal">Squiggles mean 'text, not readable' and cost nothing — no lorem ipsum, no fake copy. One orange badge is all the UI furniture needed.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="45-light-artefact-dark-ground.png" alt=""><figcaption><b>45-light-artefact-dark-ground.png</b><span class="use">A bright white dashboard and share sheet floating on black, cursor included; the subject reduced to a small inset bottom-left.</span><span class="steal">Contrast does the framing: a white artefact on black needs no border. The presenter can shrink to thumbnail when the modal is the point.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="46-checked-title.png" alt=""><figcaption><b>46-checked-title.png</b><span class="use">'Page' in serif with a solid green circle tick beside it; a white page mock below showing weekly sales, three stat cards and one bar picked out in blue.</span><span class="steal">A serif noun plus one green tick reads as 'done, real, shipped'. One coloured bar proves the chart without a caption.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="47-mascot-roster.png" alt=""><figcaption><b>47-mascot-roster.png</b><span class="use">Full white app UI: a sidebar of coloured blob mascots with two eyes — GROKO, SHOPO, TRAVO, FITO, GIFTO, MAILO — a client list, and a weekly checklist with green ticks and a black GROKO pill on the row it touched.</span><span class="steal">Each agent is a colour and a shape, not an icon — the roster becomes the navigation. A named pill marks the row the agent acted on.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
