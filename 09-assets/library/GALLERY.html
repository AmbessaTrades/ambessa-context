<style>
 :root{--ink:#0b0b0c;--panel:#141416;--line:#232326;--text:#ece9e4;--dim:#8d8a85;--accent:#c98a4b}
 body{background:var(--ink);color:var(--text);font:16px/1.55 -apple-system,Inter,system-ui,sans-serif;margin:0;padding:56px 40px 96px;max-width:1500px;margin-inline:auto}
 h1{font:600 38px/1.1 Georgia,serif;margin:0 0 8px} p.sub{color:var(--dim);max-width:80ch;margin:0 0 8px}
 .src a{color:var(--accent);text-decoration:none} .src{color:var(--dim);margin:0 0 34px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:30px}
 figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
 img{width:100%;display:block;background:#000}
 figcaption{padding:16px 18px 20px;display:flex;flex-direction:column;gap:7px}
 figcaption b{font:600 11px/1 ui-monospace,monospace;color:#6f6c67;letter-spacing:.05em}
 .use{color:var(--text)}
 .steal{color:var(--accent);border-left:2px solid var(--accent);padding-left:12px;font-size:15px}
 .vid{color:#8d8a85;font:12px/1.4 ui-monospace,monospace;text-decoration:none} .vid:hover{color:var(--accent)}
</style>

<figure><img src="16-split-panel-talking-head-1.png" alt=""><figcaption><b>16-split-panel-talking-head-1.png</b><span class="use">Two devices from one talk: a two-tone comparison panel (sage green vs coral red) with hand-drawn geometry, and the same speaker keyed over a deep blue gradient with a translucent mark behind him</span><span class="steal">The split panel does the argument with no words; the keying lets a mark sit BEHIND the subject; black hoodie on saturated ground separates with zero effort</span></figcaption></figure>
<figure><img src="17-split-panel-talking-head-2.png" alt=""><figcaption><b>17-split-panel-talking-head-2.png</b><span class="use">Two devices from one talk: a two-tone comparison panel (sage green vs coral red) with hand-drawn geometry, and the same speaker keyed over a deep blue gradient with a translucent mark behind him</span><span class="steal">The split panel does the argument with no words; the keying lets a mark sit BEHIND the subject; black hoodie on saturated ground separates with zero effort</span></figcaption></figure>
<figure><img src="18-dark-thread-canvas.png" alt=""><figcaption><b>18-dark-thread-canvas.png</b><span class="use">Three task columns floating on near-black, the subject inset bottom-left in a rounded window, three pill bars turning green as work completes.</span><span class="steal">The ground is a product UI, not a backdrop: the interface IS the set. Subject never larger than a fifth of the frame. Green carries progress, never decoration.</span><a class="vid" href="https://youtu.be/yMnFHFf43Qg" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="19-serif-claim-pill-scale.png" alt=""><figcaption><b>19-serif-claim-pill-scale.png</b><span class="use">A serif headline ('Your brain's context window') over a row of ten rounded bars grading green to red.</span><span class="steal">One serif sentence carries the whole idea; a single row of shapes proves it. This is the house move: claim in serif, evidence as geometry.</span><a class="vid" href="https://youtu.be/yMnFHFf43Qg" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="20-annotation-arrows.png" alt=""><figcaption><b>20-annotation-arrows.png</b><span class="use">A screenshot of a real post, with orange marker highlights and hand-drawn white arrows labelled 'Works' and 'Looks'.</span><span class="steal">Annotation as argument: two arrows and two words explain a product decision. Orange only on the two phrases that matter.</span><a class="vid" href="https://youtu.be/yMnFHFf43Qg" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="21-dashboard-half.png" alt=""><figcaption><b>21-dashboard-half.png</b><span class="use">Subject in a rounded window on the left third; a full dark dashboard mock on the right with an orange sun mark above it.</span><span class="steal">The most reusable layout in the set: person left, live-looking artefact right, dotted texture in the lower third to stop the black going flat.</span><a class="vid" href="https://youtu.be/yMnFHFf43Qg" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="22-icon-diagram.png" alt=""><figcaption><b>22-icon-diagram.png</b><span class="use">'Personal intelligence agents' in serif, subtitle in sans, a monitor outline with three check-marked rows and a white circle with a pause glyph.</span><span class="steal">Thin white line icons at one weight, one green tick repeated three times. The pause circle is a character, not an icon — a small mascot earns warmth.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="23-orange-badge.png" alt=""><figcaption><b>23-orange-badge.png</b><span class="use">The same dashboard again, now carrying an orange 'AI-powered' badge, an ask bar and the words 'LLM-powered' set huge under it.</span><span class="steal">Repeat the artefact and add one element: the difference between the two frames IS the explanation. Accent used once per frame.</span><a class="vid" href="https://youtu.be/yMnFHFf43Qg" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="24-cloud-diagram.png" alt=""><figcaption><b>24-cloud-diagram.png</b><span class="use">'Projects' in serif over a cloud outline containing an orange sun mark, three crab-glyph nodes and a laptop outline below.</span><span class="steal">A diagram is allowed to be friendly. Two stroke weights (blue cloud, white laptop), orange kept for the brand mark only.</span><a class="vid" href="https://youtu.be/yMnFHFf43Qg" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="25-paper-collage.png" alt=""><figcaption><b>25-paper-collage.png</b><span class="use">A mock handwritten note showing HTML/CSS next to a torn-paper 'Video model' card with a red X, plus a green check on 'Much cheaper'.</span><span class="steal">When the argument is a comparison, leave the interface entirely: paper, marker, torn edge. Tactile beats polished for one beat, then back.</span><a class="vid" href="https://youtu.be/yMnFHFf43Qg" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="26-app-icon-grid.png" alt=""><figcaption><b>26-app-icon-grid.png</b><span class="use">Six app icons in a 3×2 grid with names under them, on black, subject still at left.</span><span class="steal">Icons as evidence in a taxonomy frame. Nothing else on screen: no paragraph, no bullet, no arrow. The grid is the sentence.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
<figure><img src="27-full-room-honest.png" alt=""><figcaption><b>27-full-room-honest.png</b><span class="use">The subject alone, full frame, real room, real window, hands moving, no graphics at all.</span><span class="steal">The reset shot. After five designed frames, one honest one buys back trust — and it is free to produce.</span><a class="vid" href="https://youtu.be/P_hvEpI0twQ" target="_blank">watch the motion →</a></figcaption></figure>
