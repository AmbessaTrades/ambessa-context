nvestors run months or years late because they wait behind open audits, and retroactive fines follow.", "w": "", "cost": "30-day statutory refund becomes months-to-years in practice; investors also cite punitive retroactive fines from indefinite audits.", "blk": false, "t": "", "u": "https://www.state.gov/reports/2026-investment-climate-statements/rwanda", "pub": "U.S. Department of State (2026 Investment Climate Statements)", "d": "", "q": "By law, foreign firms should receive value-added tax (VAT) rebates within 30 days of receipt by the Rwanda Revenue Authority (RRA); however, firms complained the process for reimbursement can take months and occasionally years."}, {"g": "African governments", "v": true, "c": "Senegal", "b": "Ministry of Justice / courts / Agence de Régulation des Marchés Publics (ARMP)", "s": "dispute_resolution", "p": "Foreign investors do not trust local courts to hear cases involving the state and route disputes offshore, which leaves government contracts contested in forums it does not control.", "w": "", "cost": "Reported complaints also include excessive and inconsistently applied tax and customs penalties, a lack of commercial arbitration mechanisms, and opaque decision-making for public contracts.", "blk": false, "t": "", "u": "https://www.state.gov/reports/2026-investment-climate-statements/senegal", "pub": "U.S. Department of State (2026 Investment Climate Statements)", "d": "", "q": "Some foreign investors, however, report discriminatory treatment by local courts and usually seek arbitration proceedings in international court when possible."}, {"g": "African governments", "v": true, "c": "Tanzania", "b": "Prime Minister's Office / Ministry of Investment, Industry and Trade", "s": "approvals", "p": "Approvals sit across ministries that do not coordinate, and negotiations with government to start a project drag on without a closing date.", "w": "", "cost": "Investors also report the Tanzania Revenue Authority does not recognise incentives granted under signed framework agreements, so negotiated terms do not survive implementation.", "blk": false, "t": "", "u": "https://www.state.gov/reports/2026-investment-climate-statements/tanzania", "pub": "U.S. Department of State (2026 Investment Climate Statements)", "d": "", "q": "The government’s bureaucracy and slow coordination between ministries and offices result in delays that have halted investments for years."}, {"g": "African governments", "v": true, "c": "Tanzania", "b": "Tanzania Investment and Special Economic Zones Authority (TISEZA) / Ministry of Lands", "s": "land_title", "p": "Foreign investors cannot own land at all; they must obtain a specific investment-purpose approval before any project site can be secured.", "w": "", "cost": "Approval must come from the Tanzania Investment and Special Economic Zones Authority (TISEZA); even with TISEZA's land bank, the report states restrictions on foreign ownership 'may significantly delay investments'.", "blk": false, "t": "", "u": "https://www.state.gov/reports/2026-investment-climate-statements/tanzania", "pub": "U.S. Department of State (2026 Investment Climate Statements)", "d": "", "q": "Foreigners are also prohibited from owning land in Tanzania, with the exception of specific investment purposes"}, {"g": "African governments", "v": true, "c": "Zambia", "b": "Ministry of Finance and National Planning / Zambia Revenue Authority", "s": "payment_arrears", "p": "Government pays vendors and VAT refunds late as a budgeting habit, which works as an unlegislated tax on the companies it has contracted.", "w": "", "cost": "Businesses also cite difficulty obtaining work permits for expatriate staff and non-transparent government tenders; public procurement of services under ZMW 3 million (~$160,000) is closed to foreign participation.", "blk": false, "t": "", "u": "https://www.state.gov/reports/2026-investment-climate-statements/zambia", "pub": "U.S. Department of State (2026 Investment Climate Statements)", "d": "", "q": "Companies have also reported that, due to ongoing fiscal constraints, the government’s payments to vendors and VAT refunds to companies are often significantly delayed, presenting an additional de facto private sector tax."}, {"g": "African governments", "v": false, "c": "Nigeria", "b": "Nigerian Investment Promotion Commission (NIPC) / Central Bank of Nigeria", "s": "counterparty_verification", "p": "Official investment records do not match actual inflows and cannot be traced to a specific investor, project or state, so officials cannot tell a real investor from an announced one.", "w": "", "cost": "$23.22bn of 2025 capital importation was ~85% portfolio flows against $923m FDI, so headline numbers say little about real projects; NIPC has asked CBN to force foreign companies to present NIPC certificates before opening bank accounts.", "blk": false, "t": "", "u": "https://nipc.gov.ng/assets/publications/nipc-annual-report-2025/nipc-annual-report-2025.pdf", "pub": "Nigerian Investment Promotion Commission", "d": "", "q": "These publications provide economic insights, sector trends, and impact assessments aimed at addressing discrepancies between official records and actual investment inflows."}, {"g": "African governments", "v": false, "c": "Nigeria", "b": "Nigerian Investment Promotion Commission (NIPC) / Federal Ministry of Industry, Trade and Investment", "s": "deal_conversion", "p": "Signed investment MoUs do not convert into executed projects, and NIPC lacks the tracking machinery across ministries and states to push them through.", "w": "", "cost": "NIPC's own 2025 report says its 2026 priority is moving 'from visibility-based promotion to outcome-based investment delivery'; a single state summit (Bauchi) produced 47 MoUs worth over $5.2bn, and the agency still has no consolidated mechanism to convert them.", "blk": false, "t": "", "u": "https://nipc.gov.ng/assets/publications/nipc-annual-report-2025/nipc-annual-report-2025.pdf", "pub": "Nigerian Investment Promotion Commission", "d": "", "q": "The Commission will strengthen its role in the technical preparation, coordination, tracking, and follow-through of investment-related Memoranda of Understanding (MoUs), working in close collaboration with relevant Ministries, Departments and Agencies (MDAs)"}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "CARICOM's own trade machinery is clogged with non-compliance and ad hoc exemptions: the Secretariat processed 192 Common External Tariff suspension requests and 66 safeguard invocations in a single year, and the Secretary-General says removing 'non-compliance' from the agenda is still an imperative.", "w": "", "cost": "In the same remarks the Secretary-General said the Region has an imperative to address the impediments to trade and remove longstanding issues of non-compliance from the agenda. Separately, CARICOM's Annual Report 2024 records that the Secretary-General processed 192 requests for suspension of the CET and 66 requests for invocation of the Safeguard Mechanism in one year, from 12 member states.", "blk": false, "t": "", "u": "https://caricom.org/caricom-sg-urges-trade-ministers-to-explore-new-trade-markets-as-coted-meets-in-guyana", "pub": "CARICOM Secretariat (Secretary-General Dr Carla Barnett, 60th COTED)", "d": "2025-06-10", "q": "We need to promote regional production and expand intra-regional trade by updating policies and practices to support entrepreneurship and make trade and business development easier."}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "Caribbean central bank governors say the region cannot keep depending on US correspondent banks, and the replacement - a CARICOM-wide local-currency settlement system linked to Africa's PAPSS - is still only a pilot.", "w": "", "cost": "CAPSS pilot covers Barbados, The Bahamas and ECCB member states plus one further country; linking to Africa is explicitly 'phase two', only after the intra-CARICOM pilot completes.", "blk": false, "t": "", "u": "https://past.jamaica-gleaner.com/article/business/20250808/caribbean-central-banks-testing-payment-system-reduce-reliance-us-banks", "pub": "Jamaica Gleaner (quoting ECCB Governor Timothy Antoine, on the record)", "d": "2025-08-08", "q": "We cannot continue to rely on correspondent banks, particularly from the US"}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "Caribbean exports are taxed punitively in African markets - rum, the region's flagship branded export, faces an 88 percent tariff - which removes the reciprocal commercial case for a deal.", "w": "", "cost": "Bilateral exports between the two regions have never surpassed 6 percent; African exports to the Caribbean have been close to 0.1 percent since 2020. Interregional trade is US$729 million against a potential US$2.1 billion within five years.", "blk": false, "t": "", "u": "https://www.afreximbank.com/no-more-missed-opportunities-strengthening-africa-caribbean-trade-and-investment-in-an-era-of-global-trade-disruption/", "pub": "Afreximbank (op-ed by ITC Executive Director Pamela Coke-Hamilton and Afreximbank President Benedict Oramah)", "d": "2025-07-24", "q": "Caribbean rum exporters currently face an 88% tariff when selling to African markets"}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "Correspondent banks have withdrawn from Caribbean jurisdictions, raising the cost of every international transaction and cutting firms off from the payment system entirely.", "w": "", "cost": "Paper quantifies de-risking across CARICOM and finds trade financing and remittances were the two most affected areas; notes Bank of America withdrew correspondent operations from Belize Bank and Atlantic Bank in 2015 and Barclays severed ties with Jamaica.", "blk": false, "t": "", "u": "https://central-bank.org.tt/cbtt_storage/pdf/impact-of-derisking-on-trade-financing-and-remittances-r.mahabir-a.-bobb-april-2020.pdf", "pub": "Central Bank of Trinidad and Tobago (working paper, April 2020)", "d": "2020-04-01", "q": "In the Caribbean the increased global scrutiny of activities of financial firms resulted in correspondent banks withdrawing their services from several of the islands, increasing costs of conducting international transactions"}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "Cross-border payment rails are the structural blocker: Caribbean payments still run through US correspondent banks, and the region has no local-currency settlement with Africa, so every deal carries an extra hop, extra cost and extra counterparty risk.", "w": "", "cost": "Note states that over the medium term 'payment systems to settle non-USD transactions and expanded trade finance' are still needed; current routing through the US is described as reinforcing dependence on incumbent supply chains.", "blk": false, "t": "", "u": "https://openknowledge.worldbank.org/server/api/core/bitstreams/fccb9c8e-ce4d-4a3e-b915-4ad960500022/content", "pub": "World Bank (Trade and Connectivity in the Caribbean, Policy Note, July 2026)", "d": "2026-07-01", "q": "Payment systems routed through the U.S. and lack of trade finance further reinforce path dependency on existing arrangements."}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "Customs and border clearance is slow and expensive: an import shipment takes two weeks to clear and clearance costs alone absorb more than a third of the goods' value.", "w": "", "cost": "Average across World Bank Enterprise Surveys in Antigua and Barbuda (2025), Barbados (2023), Jamaica (2024), St. Lucia (2025), Suriname (2025) and Trinidad and Tobago (2025). 63 percent of firms use imported inputs, averaging 38 percent of total inputs.", "blk": false, "t": "", "u": "https://openknowledge.worldbank.org/server/api/core/bitstreams/fccb9c8e-ce4d-4a3e-b915-4ad960500022/content", "pub": "World Bank (Trade and Connectivity in the Caribbean, Policy Note, July 2026)", "d": "2026-07-01", "q": "it takes on average 14 days for an import shipment to clear customs and border agencies, and the costs associated amount to 36 percent of the value of the goods"}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "De-risking has left legitimate Caribbean businesses and new ventures without banking access at all - not because of wrongdoing but because compliance cost exceeds correspondent bank profit.", "w": "", "cost": "Barbados central bank notes terminations are driven by compliance cost under Basel, FATCA and Global Forum rules rather than any wrongdoing by Caribbean businesses; a CARICOM Central Bank Governors Technical Work Group was assembled to assess regional impact.", "blk": true, "t": "", "u": "https://centralbank.org.bb/news/de-risking/de-risking-and-its-impact-the-caribbean-perspective", "pub": "Central Bank of Barbados", "d": "2020-01-01", "q": "The consequence of this is that many businesses and individuals have been cut off from their money and new businesses are finding it difficult to establish operations."}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "Logistics, not demand, is what kills Africa-Caribbean trade: the majority of unrealized trade potential is lost to transport and logistics failure, and there is no direct sea or air link.", "w": "", "cost": "The regions are 1,600 miles apart yet lack direct transport links; both rank among the lowest in the world on World Bank logistics performance. Ocean freight between West African and Caribbean ports typically routes via Europe or North America.", "blk": false, "t": "", "u": "https://www.afreximbank.com/no-more-missed-opportunities-strengthening-africa-caribbean-trade-and-investment-in-an-era-of-global-trade-disruption/", "pub": "Afreximbank (op-ed by ITC Executive Director Pamela Coke-Hamilton and Afreximbank President Benedict Oramah)", "d": "2025-07-24", "q": "ITC data show that 57% of unrealized trade potential stems from logistical challenges."}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "Moving goods into and out of the Caribbean costs multiples of the global norm, which makes any African-origin shipment uncompetitive before it lands.", "w": "", "cost": "Caribbean countries spend roughly 12-21 percent of the value of imported goods on international transport and insurance versus a global average of about 7.5 percent; Suriname sits around three times the world average.", "blk": false, "t": "", "u": "https://openknowledge.worldbank.org/server/api/core/bitstreams/fccb9c8e-ce4d-4a3e-b915-4ad960500022/content", "pub": "World Bank (Trade and Connectivity in the Caribbean, Policy Note, July 2026)", "d": "2026-07-01", "q": "Caribbean transport costs are among the highest globally, and they are even more acute for food"}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "Not all CARICOM states have even joined Afreximbank's Partnership Agreement, which caps the financing envelope available for cross-border projects and leaves some governments outside the only Africa-facing trade finance institution.", "w": "", "cost": "The communique 'APPLAUD[s] the 13 countries that have signed onto Afreximbank's Partnership Agreement' and urges the rest to formalise - meaning some CARICOM members still have no access to the Bank's project and trade facilities.", "blk": false, "t": "", "u": "https://www.afreximbank.com/communique-and-final-remarks/", "pub": "Afreximbank / Government of Grenada (Fourth AfriCaribbean Trade and Investment Forum Communique, ACTIF2025)", "d": "2025-08-01", "q": "urge remaining countries to formalize participation in order to fully benefit from tailored financing, facilitation and advisory services"}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "Sanitary and phytosanitary approval is the hidden gate on any new African food or agricultural supplier: no risk assessment exists, none is published, and getting one can take years.", "w": "", "cost": "The note also finds there is no comprehensive publicly available information on individual CARICOM countries' SPS import requirements or existing risk assessments by product-origin pair, so a supplier cannot even check the requirement.", "blk": false, "t": "", "u": "https://openknowledge.worldbank.org/server/api/core/bitstreams/fccb9c8e-ce4d-4a3e-b915-4ad960500022/content", "pub": "World Bank (Trade and Connectivity in the Caribbean, Policy Note, July 2026)", "d": "2026-07-01", "q": "If a risk assessment has not been conducted by the importing country on the particular product-origin (e.g., limes from Mexico), such an analysis is required, and it may take weeks or years to be prepared."}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "Signature is not ratification: of 15 CARICOM member states, 12 acceded but only nine completed ratification, and the region's financing ceiling doubles only when all 15 join - so the money is gated on domestic parliamentary process.", "w": "", "cost": "US$1.5 billion financing limit approved for the region, set to double to US$3 billion once all CARICOM member states join; the 2026 announcement raised the global cap to US$5 billion with over US$750 million already disbursed.", "blk": true, "t": "", "u": "https://www.afreximbank.com/haiti-becomes-12th-caricom-member-state-to-accede-to-the-afreximbank-partnership-agreement/", "pub": "Afreximbank", "d": "2024-09-30", "q": "12 of the 15 CARICOM member states have now acceded to the Partnership Agreement, with nine of them concluding its ratification."}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "Tariff and non-tariff barriers close the Caribbean market to non-traditional suppliers, including African ones, even where shipping exists.", "w": "", "cost": "Average MFN tariff around 13.2 percent in CARICOM; NTMs documented across nine Caribbean countries using the UNCTAD NTM database.", "blk": false, "t": "", "u": "https://openknowledge.worldbank.org/server/api/core/bitstreams/fccb9c8e-ce4d-4a3e-b915-4ad960500022/content", "pub": "World Bank (Trade and Connectivity in the Caribbean, Policy Note, July 2026)", "d": "2026-07-01", "q": "Policy and regulatory frictions, including elevated Most Favored Nation (MFN) tariffs, averaging around 13.2 percent in CARICOM, and complex non-tariff measures (NTMs) and standards, further impede direct sourcing from alternative suppliers."}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "The Africa-Caribbean Free Trade Arrangement that would de-risk cross-border deals is, as of the 2025 Heads-level communique, only 'endorsed' for establishment - while Afreximbank itself names inadequate transport, scarce trade and project finance, and regulatory misalignment as the persistent barriers.", "w": "", "cost": "The communique only 'WELCOME[s] the endorsement for the establishment and operationalization of an Africa-Caribbean Free Trade Arrangement' and 'UNDERTAKE[s] to support, and fast-track' air and maritime links - i.e. neither instrument exists yet.", "blk": false, "t": "", "u": "https://www.afreximbank.com/communique-and-final-remarks/", "pub": "Afreximbank / Government of Grenada (Fourth AfriCaribbean Trade and Investment Forum Communique, ACTIF2025)", "d": "2025-08-01", "q": "the persistent structural barriers to AfriCaribbean integration, including inadequate transportation and connectivity, limited access to trade and project finance, and regulatory misalignment"}, {"g": "CARICOM governments", "v": true, "c": "-", "b": "firm", "s": "", "p": "Trinidad and Tobago, the region's industrial exporter, runs a structural foreign exchange shortage - demand for USD permanently exceeds supply, forcing central bank intervention.", "w": "", "cost": "Presidential presentation describes a 'structural imbalance' in the FX market; the Bank's own monetary policy report records a net sales gap of US$1,274.1 million over January-October 2025 with US$1,087.7 million of central bank intervention to support the market.", "blk": false, "t": "", "u": "https://www.central-bank.org.tt/cbtt_storage/2025/09/media-engagement-presentation-by-governor-larry-howai-04.09.25-sept2025.pdf", "pub": "Central Bank of Trinidad and Tobago (Governor Larry Howai, presentation 4 September 2025)", "d": "2025-09-04", "q": "Constraints remain in the domestic foreign exchange market as demand continues to outstrip supply."}, {"g": "CARICOM governments", "v": true, "c": "CARICOM (regional)", "b": "CARICOM Secretariat", "s": "digital and telecoms", "p": "Digital skills and telecoms capacity gaps are explicitly named as hampering regional development, which is why so much of this trade cannot be done online yet.", "w": "Telecoms regulators and any firm trying to run cross-border digital services", "cost": "", "blk": false, "t": "Fourth AfriCaribbean Trade and Investment Forum Communique", "u": "https://www.afreximbank.com/communique-and-final-remarks", "pub": "Afreximbank / Government of Grenada", "d": "2025-07-29", "q": "digital skills shortages and capacity gaps in telecommunications and digital sectors that are hampering regional development"}, {"g": "CARICOM governments", "v": true, "c": "CARICOM (regional)", "b": "Afreximbank Partnership Agreement signatories", "s": "trade finance", "p": "Only 13 countries have signed Afreximbank's partnership agreement; the rest have no access to the tailored financing and advisory that makes a cross-regional deal bankable.", "w": "Finance ministries and state-owned banks in the countries that have not signed", "cost": "13 countries signed (source, July 2025)", "blk": true, "t": "Fourth AfriCaribbean Trade and Investment Forum Communique", "u": "https://www.afreximbank.com/communique-and-final-remarks", "pub": "Afreximbank / Government of Grenada", "d": "2025-07- tistics office treats messaging as the primary commercial channel rather than a fallback.", "w": "", "cost": "Near-zero cash cost: the channels are free, payment arrives by bank transfer or cash on delivery, and the hidden costs are unconfirmed payments and lost order tracking. Meta's 2026 per-message charges on the paid WhatsApp platform are the first real toll.", "blk": false, "t": "Capturing Informal Digital Commerce in the Caribbean: A New Framework for Measuring Messaging-Based Online Trade", "u": "https://unctad.org/system/files/non-official-document/wgecde2025_p11_jamaica.pdf", "pub": "UNCTAD (Government of Jamaica presentation)", "d": "2025-12-05", "q": "In Jamaica, informal digital commerce has flourished—driven by smartphones, social media, and youth entrepreneurship."}, {"g": "how_they_sell", "v": true, "c": "Kenya", "b": "Chpter", "s": "AI conversational commerce (WhatsApp/Instagram)", "p": "Chpter sells the channel it runs on: merchants find it inside WhatsApp and Instagram, the Safaricom Spark accelerator demo day supplied enterprise logos, and an M-PESA MOU puts it in front of 300,000 merchants at once.", "w": "", "cost": "Three revenue lines: subscription, $0.10 per AI-resolved ticket (claimed 80% cheaper than a human agent) and checkout commission. Distribution cost is carried by partners (Safaricom, Meta, M-PESA) rather than paid ads.", "blk": false, "t": "How Kenya's Chpter is powering AI-driven social commerce across Africa", "u": "https://www.techarena.co.ke/2025/04/08/chpter-ai-social-commerce-africa/", "pub": "TechArena", "d": "2025-04-08", "q": "Chpter steps in with AI agents that offer 24/7 customer support, sales assistance, and marketing automation directly on WhatsApp and Instagram."}, {"g": "how_they_sell", "v": true, "c": "Kenya", "b": "Zuri Health", "s": "digital health / telemedicine", "p": "Zuri puts a WhatsApp number in every ad and lets an AI chatbot named Vera book the doctor, while the volume comes from B2B2C deals with the M-Pes function render(){
  [...bar.querySelectorAll("button.tab")].forEach(b=>b.setAttribute("aria-pressed",
    String(b.textContent.startsWith(active === "All" ? "All" : active))));
  let rows = DATA.filter(d=>(active==="All"||d.g===active) && (!onlyBlk||d.blk) && (showUnv||d.v));
  if(q) rows = rows.filter(d=>JSON.stringify(d).toLowerCase().includes(q));
  const g=document.getElementById("grid");
  if(!rows.length){g.innerHTML='<div class="empty">Nothing matches.</div>';return;}
  g.innerHTML = rows.map(d=>`
    <article class="card ${d.blk?"blk":""}">
      <div class="meta">${esc(d.c && d.c!=="-" ? d.c : d.b)} · ${esc(d.s||"")}</div>
      ${d.blk?'<span class="flag">blocks a deal</span>':''}
      ${d.v?'':'<span class="flag" style="color:#8a7a2f">unconfirmed</span>'}
      <div class="pain">${esc(d.p)}</div>
      ${d.w?`<div class="who">felt by: ${esc(d.w)}</div>`:""}
      ${d.cost?`<div class="cost">${esc(d.cost)}</div>`:""}
      <blockquote>&ldquo;${esc(d.q)}&rdquo;</blockquote>
      <div class="src">${esc(d.pub||d.t)}${d.d?" · "+esc(d.d):""} · <a href="${esc(d.u)}" target="_blank" rel="noopener">source</a></div>
    </article>`).join("");
}
tabs(); render();
</script></body></html>
